name: "🚚 Build and deploy"

on:
    push:
        branches:
            - main
    workflow_dispatch:

env:
    IMAGE: ghcr.io/itklubbozolagan/forge
    # Must match the manifests in the k8s repository (applications/kontestis-forge).
    NAMESPACE: kontestis-forge
    DEPLOYMENT: kontestis-forge
    CONTAINER: forge

concurrency:
    group: deploy-${{ github.ref_name }}
    cancel-in-progress: false

permissions:
    contents: read
    packages: write

jobs:
    build:
        name: "🐳 Build"
        runs-on: ubuntu-latest
        outputs:
            digest: ${{ steps.docker_build.outputs.digest }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v5

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub container registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              id: docker_build
              uses: docker/build-push-action@v6
              with:
                  push: true
                  context: .
                  platforms: linux/amd64
                  tags: |
                      ${{ env.IMAGE }}:latest
                      ${{ env.IMAGE }}:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

    release:
        name: "🚚 Release"
        runs-on: ubuntu-latest
        needs: ["build"]
        steps:
            - name: "Set up kubectl"
              uses: azure/setup-kubectl@v4

            - name: "Copy kubernetes config"
              env:
                  KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
              run: |
                  install -m 700 -d ~/.kube
                  printf '%s' "$KUBE_CONFIG" | base64 -d > ~/.kube/config
                  chmod 600 ~/.kube/config

            - name: "Roll out the new image"
              env:
                  IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
              run: |
                  kubectl -n "$NAMESPACE" set image "deployment/$DEPLOYMENT" "$CONTAINER=$IMAGE@$IMAGE_DIGEST"
                  kubectl -n "$NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=300s
